services:
  - type: web
    name: pt-ai-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pt-ai-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: BOT_USERNAME
        sync: false

databases:
  - name: pt-ai-db
    plan: starter
    databaseName: ptai
    user: ptai
