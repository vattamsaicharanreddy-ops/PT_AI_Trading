<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'>
<title>PT_AI Trading</title><script src='https://cdn.tailwindcss.com'></script>
<link href='https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap' rel='stylesheet'>
<style>body{font-family:'Space Grotesk',sans-serif;}</style>
</head>
<body class='bg-[#050507] text-white min-h-screen flex justify-center'>
<div class='w-full max-w-[390px] bg-[#050507] min-h-screen relative overflow-hidden'>
<div class='absolute top-0 left-0 w-full h-[400px] bg-gradient-to-b from-[#2A1B5A]/40 to-transparent pointer-events-none'></div>
<header class='relative flex justify-between items-center p-4 pt-12'><span class='text-xs tracking-[3px]'>PT_AI Trading</span><span class='text-xs opacity-50'>● LIVE</span></header>
<div class='relative mx-4 bg-white/5 backdrop-blur-xl border border-white/10 rounded-[20px] p-3 flex justify-between items-center'>
<div class='flex items-center gap-3'><div class='w-10 h-10 rounded-full bg-gradient-to-br from-teal-400 to-cyan-600 flex items-center justify-center font-bold'>V</div><div><p class='text-[10px] text-[#FFD60A] tracking-widest'>AI ENGINE ACTIVE</p><p class='font-bold'>Varun</p></div></div>
<div class='text-right'><p class='text-[10px] opacity-50'>Balance</p><p id='balTop' class='font-bold'>$81,418.86</p></div>
</div>
<div class='relative mt-6 mx-4 bg-gradient-to-br from-[#6C3BFF] via-[#8A5CFF] to-[#A5A6F6] rounded-[32px] p-6 overflow-hidden'>
<div class='absolute inset-0 bg-[radial-gradient(circle_at_70%_30%,white/20,transparent_50%)]'></div>
<p class='relative text-white/60 text-sm'>Your profit</p>
<h1 id='profit' class='relative text-[42px] font-bold leading-none tracking-tight'>$74,173.22</h1>
<div class='relative mt-5 flex gap-2'>
<button onclick='claim()' id='claimBtn' class='bg-black text-white px-5 py-3 rounded-full font-bold text-sm flex items-center gap-2'>+ CLAIM PROFIT</button>
<span class='bg-white/20 backdrop-blur px-3 py-2 rounded-full text-xs'>+<span id='perHour'>101.77</span>/hr</span>
</div>
<p class='relative mt-3 text-[11px] text-white/60'>Profit will be transferred to your USDT balance</p>
</div>
<div class='mx-4 mt-4 bg-[#1A1A2E] border border-[#FFD60A]/20 rounded-[24px] p-5'>
<p class='text-[#FFD60A] text-[10px] tracking-widest'>BONUS • 7d 3h</p>
<h2 class='font-bold text-lg mt-1'>Get up to <span class='text-[#FFD60A]'>+200 USDT</span></h2>
<p class='text-xs opacity-60 mt-1'>Deposit in next 3 days, get +200% instantly</p>
<button onclick='document.getElementById("depositModal").classList.remove("hidden")' class='mt-4 bg-white text-black px-4 py-2 rounded-full text-sm font-bold'>Deposit →</button>
</div>
<div class='mx-4 mt-4 bg-[#2A1A4A] rounded-[24px] p-5 flex justify-between items-center'>
<div><p class='text-[10px] tracking-widest opacity-60'>FREE BONUSES</p><h3 class='font-bold'>Open Gift Boxes</h3><p class='text-xs opacity-60'>Stars and USDT rewards</p></div>
<button class='bg-gradient-to-r from-[#FFD60A] to-[#FFA600] text-black px-4 py-2 rounded-full font-bold text-sm'>Open →</button>
</div>
<div class='h-24'></div>
<div class='fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] max-w-[360px] bg-[#121214]/90 backdrop-blur-xl border border-white/10 rounded-full p-2 flex justify-around'>
<button class='w-10 h-10 bg-white/10 rounded-full'>🏠</button><button class='w-10 h-10 opacity-40'>📊</button><button class='w-10 h-10 opacity-40'>📄</button><button class='w-10 h-10 opacity-40'>👥</button><button class='w-10 h-10 opacity-40'>👤</button>
</div>
<div id='depositModal' class='hidden fixed inset-0 bg-black/80 backdrop-blur flex items-end z-50'><div class='bg-[#121214] w-full rounded-t-[32px] p-6 border-t border-white/10'>
<h3 class='font-bold text-lg'>Deposit</h3><div id='addrs' class='mt-4 space-y-3 text-xs'></div>
<button onclick='document.getElementById("depositModal").classList.add("hidden")' class='mt-4 w-full bg-white/10 py-3 rounded-full'>Close</button>
</div></div>
<script>
let userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 123456789;
let balance=81418.86, profit=74173.22, perHour=101.7779;
async function init(){
  try{
    let r=await fetch(`/api/user/${userId}`); if(r.ok){let d=await r.json(); balance=d.balance; profit=d.profit; perHour=d.profit_per_hour;}
    let a=await fetch('/api/deposit-addresses'); if(a.ok){let addrs=await a.json(); let html=''; for(let k in addrs) html+=`<div class='bg-white/5 p-3 rounded-xl flex justify-between'><span>${k}</span><span class='opacity-60 text-[10px]'>${addrs[k]}</span></div>`; document.getElementById('addrs').innerHTML=html;}
  }catch(e){}
  document.getElementById('balTop').innerText='$'+balance.toFixed(2);
  document.getElementById('perHour').innerText=perHour.toFixed(2);
  setInterval(()=>{profit+=perHour/3600; document.getElementById('profit').innerText='$'+profit.toFixed(2);},1000);
}
async function claim(){
  let btn=document.getElementById('claimBtn'); btn.innerText='Claiming...';
  let r=await fetch(`/api/claim/${userId}`,{method:'POST'}); if(r.ok){let d=await r.json(); balance=d.new_balance; profit=0; document.getElementById('balTop').innerText='$'+balance.toFixed(2); document.getElementById('profit').innerText='$0.00'; alert('Claimed $'+d.claimed.toFixed(2));}
  btn.innerText='+ CLAIM PROFIT';
}
init();
</script>
</div></body></html>
