<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Admin</title><script src='https://cdn.tailwindcss.com'></script></head>
<body class='bg-[#0a0a0f] text-white p-6 font-sans'>
<h1 class='text-3xl font-bold mb-6'>💎 PT_AI Trading - Admin Panel</h1>
<div class='grid grid-cols-3 gap-4 mb-8'>
<div class='bg-white/5 p-4 rounded-2xl border border-white/10'><p class='text-white/50 text-xs'>TOTAL USERS</p><p id='stat_users' class='text-2xl font-bold'>0</p></div>
<div class='bg-white/5 p-4 rounded-2xl border border-white/10'><p class='text-white/50 text-xs'>TOTAL BALANCE</p><p id='stat_bal' class='text-2xl font-bold text-[#FFD60A]'>$0</p></div>
<div class='bg-white/5 p-4 rounded-2xl border border-white/10'><p class='text-white/50 text-xs'>ACTIVE NOW</p><p id='stat_active' class='text-2xl font-bold text-emerald-400'>0</p></div>
</div>
<div class='bg-white/5 rounded-2xl border border-white/10 p-4'>
<h2 class='font-bold mb-4'>Users</h2>
<table class='w-full text-sm'><thead class='text-white/40'><tr><th class='text-left p-2'>ID</th><th class='text-left p-2'>Balance</th><th class='text-left p-2'>Profit</th><th>Action</th></tr></thead><tbody id='users'></tbody></table>
</div>
<div class='mt-6 bg-[#FFD60A]/10 border border-[#FFD60A]/20 p-4 rounded-2xl'>
<h3 class='font-bold text-[#FFD60A] mb-2'>Quick Edit</h3>
<input id='uid' placeholder='User ID' class='bg-black/50 border border-white/10 rounded px-3 py-2 mr-2'>
<input id='bal' placeholder='New Balance' class='bg-black/50 border border-white/10 rounded px-3 py-2 mr-2'>
<button onclick='setBal()' class='bg-[#FFD60A] text-black px-4 py-2 rounded font-bold'>Set Balance</button>
</div>
<script>
async function load(){
  let s = await fetch('/api/admin/stats').then(r=>r.json());
  document.getElementById('stat_users').innerText=s.total_users;
  document.getElementById('stat_bal').innerText='$'+s.total_balance;
  document.getElementById('stat_active').innerText=s.active_now;
  let users = await fetch('/api/admin/users').then(r=>r.json());
  let tbody=document.getElementById('users'); tbody.innerHTML='';
  users.forEach(u=>{
    tbody.innerHTML+=`<tr class='border-t border-white/5'><td class='p-2'>${u.user_id}</td><td class='p-2'>$${u.balance.toFixed(2)}</td><td class='p-2'>$${u.profit.toFixed(2)}</td><td class='p-2'><button onclick='document.getElementById("uid").value=${u.user_id}' class='text-[#FFD60A]'>Edit</button></td></tr>`
  });
}
async function setBal(){
  let id=document.getElementById('uid').value; let b=document.getElementById('bal').value;
  await fetch(`/api/admin/user/${id}/set-balance`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({balance:parseFloat(b)})});
  alert('Updated'); load();
}
load();
</script>
</body></html>
